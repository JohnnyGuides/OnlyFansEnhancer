<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fan Identity Mask</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="top">
        <img class="mark" src="icons/icon48.png" alt="">
        <div>
          <h1>Identity Mask</h1>
          <p id="count">Loading…</p>
        </div>
      </div>

      <label class="toggle">
        <span>Enabled</span>
        <span class="switch">
          <input id="enabled" type="checkbox">
          <span class="switch-track"></span>
        </span>
      </label>

      <section class="mix-card">
        <strong id="mode">Local generated avatars</strong>
        <p id="setupMessage">
          Masking and identity mappings stay in Chrome local storage.
        </p>
      </section>

      <div class="reset-actions">
        <button id="resetNames" type="button">Reset names</button>
        <button id="resetPictures" type="button">Reset pictures</button>
      </div>

      <p id="note" class="note">Changes apply to open OnlyFans tabs.</p>
      <button id="options" type="button">Open settings &amp; privacy</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
