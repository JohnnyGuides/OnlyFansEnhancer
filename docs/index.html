<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fan Identity Mask</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { background: #101621; color: #edf4fa; margin: 0; }
      main { margin: 0 auto; max-width: 760px; padding: 64px 24px; }
      h1 { font-size: clamp(2.4rem, 9vw, 4.7rem); letter-spacing: -.055em; margin: 0; }
      p { color: #c8d5e4; font-size: 1.1rem; line-height: 1.7; }
      a { color: #70d9ff; }
      .pill { color: #9c86ff; font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <p class="pill">Local identity privacy</p>
      <h1>Fan Identity Mask</h1>
      <p>
        A local Chrome extension that replaces visible fan names and avatars
        with persistent aliases on supported OnlyFans creator views. It does not
        send fan data to the developer or another service.
      </p>
      <p>
        <a href="privacy.html">Privacy policy</a> ·
        <a href="https://github.com/JohnnyGuides/OnlyFansEnhancer">Source code</a> ·
        <a href="https://github.com/JohnnyGuides/OnlyFansEnhancer/issues">Support</a>
      </p>
    </main>
  </body>
</html>
